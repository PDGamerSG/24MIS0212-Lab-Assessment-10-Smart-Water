apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-water
  namespace: water-monitoring
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: smart-water
  template:
    metadata:
      labels:
        app: smart-water
    spec:
      containers:
        - name: dashboard
          image: pdgamersg/smart-water-monitor:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smart-water
  namespace: water-monitoring
spec:
  type: NodePort
  selector:
    app: smart-water
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30110
